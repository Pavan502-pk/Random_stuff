<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="600" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Top row: GHR -> Cardington -> Lawson -->
  <rect x="40" y="40" width="220" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="150" y="68" text-anchor="middle" font-family="Calibri, Arial" font-size="17" font-weight="bold" fill="#0C447C">Infor GHR (Landmark)</text>
  <text x="150" y="90" text-anchor="middle" font-family="Calibri, Arial" font-size="13" fill="#0C447C">HR system of record</text>

  <rect x="340" y="40" width="220" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="450" y="68" text-anchor="middle" font-family="Calibri, Arial" font-size="17" font-weight="bold" fill="#085041">Cardington API</text>
  <text x="450" y="90" text-anchor="middle" font-family="Calibri, Arial" font-size="13" fill="#085041">Spring Boot, no UI</text>

  <rect x="640" y="40" width="220" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
  <text x="750" y="68" text-anchor="middle" font-family="Calibri, Arial" font-size="17" font-weight="bold" fill="#712B13">Lawson ERP (S3)</text>
  <text x="750" y="90" text-anchor="middle" font-family="Calibri, Arial" font-size="13" fill="#712B13">Legacy back office</text>

  <line x1="260" y1="75" x2="338" y2="75" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="299" y="65" text-anchor="middle" font-family="Calibri, Arial" font-size="12" fill="#333333">calls API</text>

  <line x1="560" y1="62" x2="638" y2="62" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="599" y="52" text-anchor="middle" font-family="Calibri, Arial" font-size="12" fill="#333333">DME read</text>

  <line x1="638" y1="92" x2="560" y2="92" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="599" y="112" text-anchor="middle" font-family="Calibri, Arial" font-size="12" fill="#333333">AGS write</text>

  <!-- Deployment container -->
  <rect x="40" y="170" width="820" height="340" rx="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="64" y="205" font-family="Calibri, Arial" font-size="16" font-weight="bold" fill="#2C2C2A">Cardington Deployment</text>
  <text x="64" y="228" font-family="Calibri, Arial" font-size="13" fill="#444441">On-base proxy servers (shared with OnBase Proxy, Trinisys)</text>

  <line x1="450" y1="110" x2="450" y2="168" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dev -->
  <rect x="80" y="250" width="180" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="170" y="290" text-anchor="middle" font-family="Calibri, Arial" font-size="15" font-weight="bold" fill="#2C2C2A">Dev node</text>

  <!-- QA group -->
  <rect x="300" y="250" width="240" height="150" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="420" y="278" text-anchor="middle" font-family="Calibri, Arial" font-size="15" font-weight="bold" fill="#26215C">QA</text>
  <text x="420" y="298" text-anchor="middle" font-family="Calibri, Arial" font-size="12" fill="#3C3489">Behind F5 load balancer (VIP)</text>
  <rect x="320" y="320" width="90" height="50" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <text x="365" y="350" text-anchor="middle" font-family="Calibri, Arial" font-size="13" fill="#26215C">Node A</text>
  <rect x="430" y="320" width="90" height="50" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <text x="475" y="350" text-anchor="middle" font-family="Calibri, Arial" font-size="13" fill="#26215C">Node B</text>

  <!-- Prod group -->
  <rect x="580" y="250" width="240" height="150" rx="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="700" y="278" text-anchor="middle" font-family="Calibri, Arial" font-size="15" font-weight="bold" fill="#412402">Prod</text>
  <text x="700" y="298" text-anchor="middle" font-family="Calibri, Arial" font-size="12" fill="#633806">Behind F5 load balancer (VIP)</text>
  <rect x="600" y="320" width="90" height="50" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/>
  <text x="645" y="350" text-anchor="middle" font-family="Calibri, Arial" font-size="13" fill="#412402">Node A</text>
  <rect x="710" y="320" width="90" height="50" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/>
  <text x="755" y="350" text-anchor="middle" font-family="Calibri, Arial" font-size="13" fill="#412402">Node B</text>

  <!-- Log/disk note -->
  <rect x="80" y="430" width="740" height="50" rx="10" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="450" y="460" text-anchor="middle" font-family="Calibri, Arial" font-size="13" fill="#2C2C2A">Isolated log mount per node &#8212; /opt/cardington/log/cardington.log</text>

  <text x="450" y="525" text-anchor="middle" font-family="Calibri, Arial" font-size="12" fill="#666666">Unix admin team manages servers | F5 team manages load balancer | ERP infra team supports app layer</text>
</svg>
